name: Deploy embed to Cloudflare Pages

# Disabled: auto-deploy moved to S3 (deploy-embed.yml). Push trigger kept but
# commented out; workflow_dispatch stays so it can still be run by hand.
on:
  workflow_dispatch:
#  push:
#    branches:
#      - release/v10.0.0
#    paths:
#      - "embed/**"
#      # The build bundles UI strings and card icons from the site's public/.
#      - "public/locales/**"
#      - "public/images/**"
#      - ".github/workflows/deploy-embed-cloudflare.yml"

# Pages serves the deploy that finishes last. Needs Gitea >= 1.26.
concurrency:
  group: deploy-embed
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: embed/package-lock.json

      - name: Install
        working-directory: embed
        run: npm ci

      # Also typechecks — the build script is `tsc --noEmit && vite build`.
      - name: Build
        working-directory: embed
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy embed/dist
            --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.ref_name }}
