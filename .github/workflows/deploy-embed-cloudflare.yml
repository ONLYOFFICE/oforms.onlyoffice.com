name: Deploy embed to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - release/v10.0.0
    paths:
      - "embed-new/**"
      # The build bundles UI strings and card icons from the site's public/.
      - "public/locales/**"
      - "public/images/**"
      - ".github/workflows/deploy-embed-cloudflare.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: embed-new/package-lock.json

      - name: Install
        working-directory: embed-new
        run: npm ci

      # Before the build: it reads data-version.txt for the ?v= stamp and copies
      # static/embed-data into dist. EMBED_CMS_URL must be the Strapi v5 instance.
      - name: Generate catalog data
        env:
          EMBED_CMS_URL: ${{ vars.EMBED_CMS_URL }}
        run: node embed-new/scripts/generate-data.mjs

      # Also typechecks — the build script is `tsc --noEmit && vite build`.
      - name: Build
        working-directory: embed-new
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy embed-new/dist
            --project-name=${{ secrets.CLOUDFLARE_EMBED_PROJECT_NAME }}
            --branch=${{ github.ref_name }}
