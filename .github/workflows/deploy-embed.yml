name: Deploy embed to S3

on:
  workflow_dispatch:
  push:
    branches:
      - release/v10.0.0
    paths:
      - "embed/**"
      # Deploys to Workers, not here — and a run restamps ?v=, refetching 732 KB.
      - "!embed/deploy-hook/**"
      # The build bundles UI strings and card icons from the site's public/.
      - "public/locales/**"
      - "public/images/**"
      - ".github/workflows/deploy-embed.yml"

# Two concurrent runs would interleave the two sync steps and could push a
# mismatched bundle/catalog pair. Needs Gitea >= 1.26.
concurrency:
  group: deploy-embed
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: embed/package-lock.json

      - name: Install
        working-directory: embed
        run: npm ci

      # Before the build: it reads data-version.txt for the ?v= stamp and copies
      # static/embed-data into dist. EMBED_CMS_URL must be the Strapi v5 instance.
      - name: Generate catalog data
        env:
          EMBED_CMS_URL: ${{ vars.EMBED_CMS_URL }}
        run: node embed/scripts/generate-data.mjs

      # Also typechecks — the build script is `tsc --noEmit && vite build`.
      - name: Build
        working-directory: embed
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Mirrors static/_headers: asset filenames are content-hashed and catalogs
      # are requested with a ?v= stamp, so they can be cached forever; everything
      # else (index.html) must revalidate. --delete with filters only removes
      # objects matched by the filters, so the two syncs don't fight each other.
      - name: Sync hashed assets and catalogs (immutable)
        run: >-
          aws s3 sync embed/dist "${{ vars.AWS_BUCKET_URL }}"
          --delete
          --exclude "*"
          --include "assets/*"
          --include "embed-data/*"
          --cache-control "public, max-age=31536000, immutable"

      - name: Sync the rest (no cache)
        run: >-
          aws s3 sync embed/dist "${{ vars.AWS_BUCKET_URL }}"
          --delete
          --exclude "assets/*"
          --exclude "embed-data/*"
          --cache-control "public, max-age=0, must-revalidate"

      # Every deploy restamps ?v= and reuploads the whole site, so invalidate
      # everything — one /* path counts as a single invalidation path anyway.
      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}"
          --paths "/*"
