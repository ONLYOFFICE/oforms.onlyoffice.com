name: Deploy embed to S3

on:
  workflow_dispatch:

# Queued, not cancelled: two runs interleaving the two --delete syncs, or a run stopped
# between them, leave index.html pointing at deleted assets. Needs Gitea >= 1.26.
concurrency:
  group: deploy-embed
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: embed/package-lock.json

      - name: Install
        working-directory: embed
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # The catalogs' ?v= stamp: the newest data/<locale>.json beside FILES_BUCKET_URL.
      - name: Read the catalogs' upload time
        env:
          FILES_BUCKET_URL: ${{ vars.FILES_BUCKET_URL }}
        run: |
          path=${FILES_BUCKET_URL#s3://}
          prefix=${path#*/}
          time=$(aws s3api list-objects-v2 --bucket "${path%%/*}" --prefix "${prefix%files}data/" \
            --query 'max(Contents[].LastModified)' --output text)
          test "$time" != None
          echo "EMBED_DATA_TIME=$time" >> "$GITHUB_ENV"

      # Also typechecks — the build script is `tsc --noEmit && vite build`.
      - name: Build
        working-directory: embed
        run: npm run build

      # Mirrors static/_headers: asset filenames are content-hashed, so they can
      # be cached forever; everything else (index.html) must revalidate. --delete
      # with filters only removes objects matched by the filters, so the two
      # syncs don't fight each other. The first deploy without embed-data/
      # deletes the old catalogs; only this app read them.
      - name: Sync hashed assets (immutable)
        run: >-
          aws s3 sync embed/dist "${{ vars.AWS_BUCKET_URL }}"
          --delete
          --exclude "*"
          --include "assets/*"
          --cache-control "public, max-age=31536000, immutable"

      - name: Sync the rest (no cache)
        run: >-
          aws s3 sync embed/dist "${{ vars.AWS_BUCKET_URL }}"
          --delete
          --exclude "assets/*"
          --cache-control "public, max-age=0, must-revalidate"

      # Every deploy reuploads the whole site, so invalidate everything — one /*
      # path counts as a single invalidation path anyway.
      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}"
          --paths "/*"
